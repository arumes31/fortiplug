<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --fg: #222; --muted: #666; --bg: #fff; --line: #eee; --hover: #f1f3f5; --accent: #c8102e; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #eee; --muted: #aaa; --bg: #2b2a33; --line: #3a3944; --hover: #3a3944; }
    }
    body { margin: 0; width: 340px; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    h1 { margin: 0; padding: 10px 12px; font-size: 13px; color: #fff; background: var(--accent); }
    h2 { margin: 0; padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em; }
    .msg { padding: 6px 12px 10px; color: var(--muted); }
    button { display: block; width: 100%; padding: 9px 12px; border: none; border-bottom: 1px solid var(--line);
      background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
    button:hover { background: var(--hover); }
    .feature { padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .feature:last-child { border-bottom: none; }
    .feature .name { font-weight: 600; }
    .feature .desc { margin-top: 2px; color: var(--fg); }
    .feature .usage { margin-top: 3px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>FortiPlug</h1>
  <h2>On this page</h2>
  <div id="actions"><div class="msg">Loading…</div></div>
  <h2>Features</h2>
  <div id="features"></div>
  <script src="../src/core.js"></script>
  <script src="../src/policy-names.js"></script>
  <script src="../src/features/copy-policies.js"></script>
  <script src="../src/features/policy-clipboard.js"></script>
  <script src="../src/features/bulk-interfaces.js"></script>
  <script src="../src/features/bulk-rename.js"></script>
  <script src="popup.js"></script>
</body>
</html>
